<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LangGraph4j Chat</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
        textarea { width: 100%; box-sizing: border-box; font: inherit; padding: 8px; }
        button { margin-top: 8px; padding: 8px 16px; font: inherit; cursor: pointer; }
        #response { margin-top: 16px; padding: 12px; background: #f4f4f4; border-radius: 6px; white-space: pre-wrap; min-height: 1.5em; }
    </style>
</head>
<body>
<h1>LangGraph4j Chat</h1>
<form id="chat-form">
    <textarea id="message" rows="3" placeholder="Ask something...">Explain LangGraph in one sentence.</textarea>
    <button type="submit">Send</button>
</form>
<div id="response"></div>
<script>
    const form = document.getElementById('chat-form');
    const output = document.getElementById('response');
    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        output.textContent = 'Thinking...';
        try {
            const res = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: document.getElementById('message').value })
            });
            const data = await res.json();
            output.textContent = res.ok ? data.response : 'Error ' + res.status + ': ' + (data.message || data.error);
        } catch (err) {
            output.textContent = 'Request failed: ' + err;
        }
    });
</script>
</body>
</html>
